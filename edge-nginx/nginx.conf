# Shared reverse-proxy in front of multiple services on this host, routed by
# hostname. Currently just PRISM (dashboard-utility) — add a server block per
# additional service/domain as they're brought under this proxy.

server {
    listen 80;
    server_name prism.comviva.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name prism.comviva.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Database backup uploads/downloads can be large.
    client_max_body_size 500M;

    location / {
        proxy_pass https://172.25.47.101:5173;
        # dashboard-utility's own nginx also uses a self-signed cert for this
        # same host — this is an internal hop, not what browsers see.
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
