version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
      POSTGRES_DB: prism
    ports:
      - "5432:5432"
    volumes:
      - prism_db:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PORT: 4000
      DATABASE_URL: postgres://prism:prism@db:5432/prism
      SESSION_SECRET: prism_dev_secret
      CORS_ORIGIN: https://prism.theshabd.org
      ENTRA_TENANT_ID: ""
      ENTRA_CLIENT_ID: ""
      ENTRA_CLIENT_SECRET: ""
      ENTRA_REDIRECT_URI: ""
      SNAPSHOT_DIR: /app/data/snapshots
      SNAPSHOT_RETENTION_WEEKLY: 12
      SNAPSHOT_RETENTION_SAFETY: 5
      SNAPSHOT_MAX_UPLOAD_MB: 500
    ports:
      - "4000:4000"
    volumes:
      - prism_snapshots:/app/data/snapshots
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  prism_db:
  prism_snapshots:
