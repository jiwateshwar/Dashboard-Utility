version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
      POSTGRES_DB: prism
    ports:
      - "5432:5432"
    volumes:
      - prism_db:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PORT: 4000
      DATABASE_URL: postgres://prism:prism@db:5432/prism
      SESSION_SECRET: prism_dev_secret
      # Every address this app is reachable from, comma-separated — each one
      # needs its own matching redirect URI registered in Azure too (see the
      # SSO Settings page for the exact list once this is deployed).
      CORS_ORIGIN: https://172.25.47.101:5173,https://prism.comviva.com
      # Entra ID (Azure AD) SSO is configured from the app itself now — log in
      # as a SuperAdmin and open "SSO Settings" to set the tenant/client
      # ID/secret, test the connection, and go live. These env vars only seed
      # the very first run (when no config has been saved yet); after that,
      # the database is the source of truth and these are ignored.
      ENTRA_TENANT_ID: ""
      ENTRA_CLIENT_ID: ""
      ENTRA_CLIENT_SECRET: ""
      ENTRA_REDIRECT_URI: https://172.25.47.101:5173/api/auth/entra/callback
      SNAPSHOT_DIR: /app/data/snapshots
      SNAPSHOT_RETENTION_WEEKLY: 12
      SNAPSHOT_RETENTION_SAFETY: 5
      SNAPSHOT_MAX_UPLOAD_MB: 500
      # Email notifications are configured from the app (SuperAdmin → Email
      # Settings). These only seed the first run; values come from the
      # Portainer stack's environment variables — never put the password here.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_BASE_URL: https://prism.comviva.com
      NOTIFY_TZ: Asia/Kolkata
    ports:
      - "4000:4000"
    volumes:
      - prism_snapshots:/app/data/snapshots
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      # Self-signed TLS cert/key, provisioned onto this volume outside of
      # Git (see frontend/certs/README.md) — not baked into the image.
      - frontend_certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  prism_db:
  prism_snapshots:
  frontend_certs:
